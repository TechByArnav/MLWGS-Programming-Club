<!-- MLWGS Programming Club Logo — SVG (vector replacement for logo.png) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <style>
      .dragon { fill: none; stroke: #1a8a3a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .code { fill: #1a8a3a; }
      .accent { fill: #d4af37; }
    </style>
  </defs>
  <!-- Dragon body (coiled) -->
  <path class="dragon" d="M 60 40 Q 90 20 130 50 Q 150 80 140 130 Q 130 180 90 160 Q 50 140 60 90 Q 70 40 60 40" />
  <!-- Dragon head -->
  <path class="dragon" d="M 60 40 Q 40 45 35 65 Q 40 80 60 75" />
  <!-- Dragon wing -->
  <path class="dragon" d="M 130 50 Q 170 45 175 80 Q 160 100 140 90" />
  <!-- Binary code digits -->
  <text class="code" x="110" y="100" font-family="monospace" font-size="10">0</text>
  <text class="code" x="125" y="95" font-family="monospace" font-size="10">1</text>
  <text class="code" x="130" y="115" font-family="monospace" font-size="10">0</text>
  <text class="code" x="115" y="125" font-family="monospace" font-size="10">1</text>
  <text class="code" x="70" y="145" font-family="monospace" font-size="10">0</text>
  <text class="code" x="85" y="135" font-family="monospace" font-size="10">1</text>
  <!-- MLWGS text -->
  <text class="code" x="55" y="120" font-family="monospace" font-size="22" font-weight="bold">{</text>
  <text class="code" x="75" y="120" font-family="monospace" font-size="22" font-weight="bold">M</text>
  <text class="code" x="92" y="120" font-family="monospace" font-size="22" font-weight="bold">L</text>
  <text class="code" x="109" y="120" font-family="monospace" font-size="22" font-weight="bold">W</text>
  <text class="code" x="129" y="120" font-family="monospace" font-size="22" font-weight="bold">G</text>
  <text class="code" x="149" y="120" font-family="monospace" font-size="22" font-weight="bold">S</text>
  <text class="code" x="169" y="120" font-family="monospace" font-size="22" font-weight="bold">}</text>
  <!-- Accent dot -->
  <circle class="accent" cx="150" cy="150" r="4" />
</svg>
